; PlatformIO で書き込む場合の設定
;   pio run -t upload
; Arduino IDE を使う場合はこのファイルは不要です。
; （ボード: M5Stick-C / ライブラリ: M5StickC）

[platformio]
src_dir = ArcheryTimer

[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    m5stack/M5StickC @ ^0.2.8
